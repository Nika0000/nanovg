name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Check docs types
        working-directory: docs/site
        run: npm run typecheck

      - name: Check docs links
        working-directory: docs/site
        run: npm run check:links

      - name: Build docs
        working-directory: docs/site
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}/docs
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p build-pages/docs
          cp -a docs/site/out/. build-pages/docs/
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=./docs/"><a href="./docs/">NanoVG documentation</a>\n' > build-pages/index.html
          touch build-pages/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
